name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 2
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate release secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          missing=0
          for value in \
            "$CERTIFICATE_BASE64" \
            "$CERTIFICATE_PASSWORD" \
            "$APPLE_ID" \
            "$APPLE_TEAM_ID" \
            "$APPLE_APP_SPECIFIC_PASSWORD"; do
            if [[ -z "$value" ]]; then
              missing=1
            fi
          done

          if [[ "$missing" == 1 ]]; then
            echo "One or more required release secrets are missing." >&2
            exit 2
          fi

      - name: Lint and test
        run: |
          bash -n script/*.sh script/lib/*.sh
          bash script/test_release_lib.sh
          swift format lint --recursive --strict Sources Tests Package.swift
          swift test --parallel

      - name: Import Developer ID certificate and notarization profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/agentactivity-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          echo "SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          signing_identity="$(security find-identity -v -p codesigning "$keychain_path" | awk -F '"' '/Developer ID Application/ {print $2; exit}')"
          if [[ -z "$signing_identity" ]]; then
            echo "No Developer ID Application identity was imported." >&2
            exit 1
          fi

          xcrun notarytool store-credentials AgentActivity-Notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$keychain_path"

          echo "SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"
          echo "NOTARY_PROFILE=AgentActivity-Notary" >> "$GITHUB_ENV"

      - name: Build signed and notarized distribution
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          NOTARIZE: 1
          VERSION: ${{ steps.version.outputs.version }}
        run: ./script/build_distribution.sh

      - name: Verify signed and notarized distribution
        env:
          REQUIRE_NOTARIZATION: 1
          VERSION: ${{ steps.version.outputs.version }}
        run: ./script/verify_distribution.sh

      - name: Attest DMG provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/AgentActivity-${{ steps.version.outputs.version }}-macos-universal.dmg

      - name: Attest ZIP provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/AgentActivity-${{ steps.version.outputs.version }}-macos-universal.zip

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: AgentActivity-${{ steps.version.outputs.version }}-signed-notarized
          path: |
            dist/AgentActivity-${{ steps.version.outputs.version }}-macos-universal.dmg
            dist/AgentActivity-${{ steps.version.outputs.version }}-macos-universal.dmg.sha256
            dist/AgentActivity-${{ steps.version.outputs.version }}-macos-universal.zip
            dist/AgentActivity-${{ steps.version.outputs.version }}-macos-universal.zip.sha256
          if-no-files-found: error

      - name: Publish or update private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$(gh repo view --json visibility --jq .visibility)" != "PRIVATE" ]]; then
            echo "Refusing to publish AgentActivity to a non-private repository." >&2
            exit 1
          fi

          assets=(
            "dist/AgentActivity-$RELEASE_VERSION-macos-universal.dmg"
            "dist/AgentActivity-$RELEASE_VERSION-macos-universal.dmg.sha256"
            "dist/AgentActivity-$RELEASE_VERSION-macos-universal.zip"
            "dist/AgentActivity-$RELEASE_VERSION-macos-universal.zip.sha256"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "AgentActivity $RELEASE_TAG" \
              --draft=false \
              --latest
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "AgentActivity $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Remove temporary Keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  release-notes:
    name: Update release notes
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/release-notes.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
