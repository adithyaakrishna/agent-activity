name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Lint shell scripts
        run: bash -n script/*.sh script/lib/*.sh

      - name: Test release shell library
        run: bash script/test_release_lib.sh

      - name: Lint Swift formatting
        run: swift format lint --recursive --strict Sources Tests Package.swift

      - name: Run tests
        run: swift test --parallel

  distribution:
    name: Build universal distribution
    needs: quality
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build unsigned CI artifacts
        env:
          VERSION: 0.0.0-ci
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./script/build_distribution.sh

      - name: Verify unsigned CI artifacts
        env:
          VERSION: 0.0.0-ci
        run: ./script/verify_distribution.sh

      - name: Upload universal distribution
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: AgentActivity-macOS-universal-unsigned
          path: |
            dist/AgentActivity-0.0.0-ci-macos-universal.dmg
            dist/AgentActivity-0.0.0-ci-macos-universal.dmg.sha256
            dist/AgentActivity-0.0.0-ci-macos-universal.zip
            dist/AgentActivity-0.0.0-ci-macos-universal.zip.sha256
          if-no-files-found: error
          retention-days: 7
